<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个适合 GitHub Pages 的纯前端 Markdown 文档浏览器">
    <title>Markdown 文档中心</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" id="highlight-theme-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css" id="highlight-theme-dark" disabled>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button menu-button" id="menu-button" type="button" aria-label="打开文档目录" aria-controls="sidebar" aria-expanded="false">
        <span aria-hidden="true">☰</span>
      </button>
      <a class="brand" href="./" aria-label="返回文档首页">
        <span class="brand-mark" aria-hidden="true">M↓</span>
        <span id="project-name">Markdown 文档中心</span>
      </a>
      <span class="topbar-divider" aria-hidden="true"></span>
      <span class="current-file" id="current-file">正在载入…</span>
      <button class="theme-button" id="theme-button" type="button" aria-label="切换深色模式">
        <span id="theme-icon" aria-hidden="true">☾</span>
        <span id="theme-label">深色</span>
      </button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="文档导航">
        <div class="sidebar-header">
          <label class="search-box" for="search-input">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索文件名或内容" autocomplete="off">
            <kbd>/</kbd>
          </label>
          <p class="search-hint" id="search-hint">输入至少 2 个字符可搜索正文</p>
        </div>
        <nav class="file-tree" id="file-tree" aria-label="Markdown 文件列表"></nav>
        <div class="search-results" id="search-results" hidden></div>
        <footer class="sidebar-footer"><span id="document-count">0</span> 篇文档</footer>
      </aside>

      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭文档目录" hidden></button>

      <main class="content" id="main-content">
        <div class="document-state" id="document-state" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在载入文档…</p>
        </div>

        <article class="document-card" id="document-card" hidden>
          <header class="document-header">
            <p class="document-path" id="document-path"></p>
            <h1 id="document-title"></h1>
          </header>
          <details class="mobile-toc" id="mobile-toc">
            <summary>本页目录</summary>
            <nav id="mobile-toc-list" aria-label="本页目录（移动端）"></nav>
          </details>
          <div class="markdown-body" id="markdown-content"></div>
        </article>
      </main>

      <aside class="toc-panel" id="toc-panel" aria-label="本页目录">
        <div class="toc-sticky">
          <p class="toc-title">本页目录</p>
          <nav id="toc-list"></nav>
        </div>
      </aside>
    </div>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>

    <noscript>此阅读器需要启用 JavaScript 才能加载 Markdown 文档。</noscript>

    <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    <script defer src="./js/file-tree.js"></script>
    <script defer src="./js/markdown.js"></script>
    <script defer src="./js/app.js"></script>
  </body>
</html>
