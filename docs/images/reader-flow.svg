<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 文档阅读流程</title>
  <desc id="desc">从 Markdown 文件经过解析器，最终显示为网页。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="360" rx="24" fill="#f6f8fa"/>
  <path d="M290 180h95M575 180h95" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
  <path d="m370 168 18 12-18 12M655 168l18 12-18 12" fill="none" stroke="#8c959f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="70" y="95" width="220" height="170" rx="18" fill="#fff" stroke="#d0d7de"/>
    <rect x="385" y="95" width="190" height="170" rx="18" fill="url(#bg)"/>
    <rect x="670" y="95" width="220" height="170" rx="18" fill="#fff" stroke="#d0d7de"/>
  </g>
  <path d="M125 135h86l30 30v62H125z" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <path d="M211 135v30h30" fill="none" stroke="#0969da" stroke-width="3"/>
  <text x="180" y="207" fill="#0969da" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" text-anchor="middle">MD</text>
  <text x="180" y="300" fill="#1f2328" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Markdown 文件</text>
  <text x="480" y="166" fill="#fff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">markdown-it</text>
  <text x="480" y="196" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">Mermaid · KaTeX</text>
  <text x="480" y="219" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">highlight.js</text>
  <rect x="718" y="130" width="124" height="94" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="3"/>
  <path d="M735 153h62M735 172h90M735 191h70" stroke="#0969da" stroke-width="5" stroke-linecap="round"/>
  <text x="780" y="300" fill="#1f2328" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">漂亮的网页</text>
</svg>
